name: QIP Android Build & Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android Node (APK & AAB)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x android/gradlew || true

      - name: Build Android Debug & Release APK with Gradle
        working-directory: ./android
        run: |
          echo "Starting Gradle APK compilation..."
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --stacktrace --no-daemon || gradle assembleDebug --stacktrace --no-daemon
          else
            gradle assembleDebug --stacktrace --no-daemon
          fi

      - name: Locate and Verify Generated APK
        run: |
          mkdir -p artifacts/apk
          echo "Locating built APKs..."
          find android/app/build/outputs/apk/ -name "*.apk" -type f -exec cp -v {} artifacts/apk/ \; || true
          
          # Check if real APK was produced, display actual size
          ls -lh artifacts/apk/
          
          # Compute sha256 checksums
          cd artifacts/apk && for f in *.apk; do [ -f "$f" ] && sha256sum "$f" > "$f.sha256"; done && cd ../..

      - name: Upload Real Android APK
        uses: actions/upload-artifact@v4
        with:
          name: qip-android-apk
          path: artifacts/apk/*
          retention-days: 14
