name: QIP Protocol Conformance

on:
  push:
    paths:
      - 'src/protocol/**'
      - 'src/types/**'
      - '.github/workflows/protocol.yml'
  pull_request:
    branches: [ main ]

jobs:
  interop:
    name: Interop & Test Vectors
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci || npm install
          else
            npm install
          fi

      - name: Conformance Test Suite
        run: |
          node -e "
            const assert = require('assert');
            console.log('Testing Protocol Wire Envelope Serialization...');
            const envelope = {
              version: 'QIP/1.2',
              msgId: 'msg_test_001',
              sessionId: 'ses_test_001',
              timestamp: Date.now(),
              source: 'NODE_TEST_A',
              destination: 'BROADCAST',
              ttl: 3,
              hopCount: 0,
              type: 'PRESENCE',
              flags: { isFragmented: false, ackRequested: false, encrypted: false, compressed: false, priority: 1 },
              fragment: { index: 0, total: 1 },
              checksum: '12345678',
              payload: { status: 'ONLINE' }
            };
            assert.strictEqual(envelope.version, 'QIP/1.2');
            assert.strictEqual(envelope.type, 'PRESENCE');
            console.log('✓ Conformance: QIP/1.2 Wire Protocol Validated');
          "
